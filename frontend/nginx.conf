worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 12m;

    upstream mineguard_backend {
        server backend:8000;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /api {
            return 308 /api/;
        }

        location /api/ {
            proxy_pass http://mineguard_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location = /health {
            proxy_pass http://mineguard_backend/health;
            proxy_set_header Host $host;
        }

        location = /docs {
            proxy_pass http://mineguard_backend/docs;
            proxy_set_header Host $host;
        }

        location = /docs/oauth2-redirect {
            proxy_pass http://mineguard_backend/docs/oauth2-redirect;
            proxy_set_header Host $host;
        }

        location = /redoc {
            proxy_pass http://mineguard_backend/redoc;
            proxy_set_header Host $host;
        }

        location = /openapi.json {
            proxy_pass http://mineguard_backend/openapi.json;
            proxy_set_header Host $host;
        }

        location = /index.html {
            expires -1;
        }

        location /assets/ {
            expires 1y;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
